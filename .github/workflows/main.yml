name: Make PassWall run files

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt version
        required: true
        type: choice
        default: "24.10"
        options:
          - "24.10"
          - "25.12"

permissions:
  contents: write

env:
  PASSWALL_REPOSITORY: Openwrt-Passwall/openwrt-passwall
  OPENWRT_VERSION: ${{ inputs.openwrt_version }}
  PASSWALL_FEED_ROOT: https://master.dl.sourceforge.net/project/openwrt-passwall-build

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest PassWall release
        id: passwall_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PASSWALL_REPOSITORY}/releases/latest" \
            -o "${RUNNER_TEMP}/passwall-release.json"

          latest_tag="$(jq -er '.tag_name' "${RUNNER_TEMP}/passwall-release.json")"
          safe_tag="$(printf '%s' "${latest_tag}" | tr -c 'A-Za-z0-9._+-' '_')"

          [ -n "${latest_tag}" ] || {
            echo "::error::The latest PassWall release tag is empty"
            exit 1
          }

          echo "PASSWALL_TAG=${latest_tag}" >> "${GITHUB_ENV}"
          echo "PASSWALL_SAFE_TAG=${safe_tag}" >> "${GITHUB_ENV}"
          echo "Latest PassWall release: ${latest_tag}"

      - name: Select and download LuCI packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "${OPENWRT_VERSION}" in
            24.10)
              package_extension="ipk"
              asset_prefix="23.05-24.10_"
              ;;
            25.12)
              package_extension="apk"
              asset_prefix="25.12+_"
              ;;
            *)
              echo "::error::Unsupported OpenWrt version: ${OPENWRT_VERSION}"
              exit 1
              ;;
          esac

          release_json="${RUNNER_TEMP}/passwall-release.json"

          select_asset() {
            local package_name="$1"
            jq -er \
              --arg package_name "${package_name}" \
              --arg extension "${package_extension}" \
              --arg prefix "${asset_prefix}" \
              '[.assets[]
                | select(.name | startswith($prefix))
                | select(.name | test("(^|_)" + $package_name + "[_-].*\\." + $extension + "$"))]
               | if length == 1 then .[0]
                 else error("expected exactly one " + $package_name + "." + $extension + " asset, found " + (length | tostring))
                 end' \
              "${release_json}"
          }

          download_asset() {
            local package_name="$1"
            local asset_json
            local asset_name
            local asset_url

            asset_json="$(select_asset "${package_name}")"
            asset_name="$(jq -er '.name' <<< "${asset_json}")"
            asset_url="$(jq -er '.url' <<< "${asset_json}")"

            echo "Downloading ${asset_name}..."
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 600 \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -o "downloads/${asset_name}" \
              "${asset_url}"

            test -s "downloads/${asset_name}"
          }

          mkdir -p downloads
          if ! download_asset "luci-app-passwall" || \
             ! download_asset "luci-i18n-passwall-zh-cn"; then
            echo "::error::No unique PassWall assets matched prefix '${asset_prefix}' and extension '.${package_extension}'."
            echo "Available release assets:"
            jq -r '.assets[].name' "${release_json}"
            exit 1
          fi

          echo "PACKAGE_EXTENSION=${package_extension}" >> "${GITHUB_ENV}"
          ls -lh downloads/

      - name: Download complete offline dependency bundles
        run: |
          set -euo pipefail

          download_dependencies() {
            local arch="$1"
            local output_dir="$2"
            local sourceforge_url="https://sourceforge.net/projects/openwrt-passwall-build/files/releases/packages-${OPENWRT_VERSION}/${arch}/passwall_packages/"
            local page_file="${RUNNER_TEMP}/${arch}-passwall-packages.html"
            local links_file="${RUNNER_TEMP}/${arch}-passwall-packages-links.txt"
            local link
            local filename

            mkdir -p "${output_dir}/depends"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 4 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 300 \
              -o "${page_file}" \
              "${sourceforge_url}"

            grep -oE 'href="https://sourceforge\.net/projects/openwrt-passwall-build/files/[^\"]+\.'"${PACKAGE_EXTENSION}"'/download"' \
              "${page_file}" \
              | sed -e 's/^href="//' -e 's/"$//' \
              | sort -u > "${links_file}"

            if [ ! -s "${links_file}" ]; then
              echo "::error::No .${PACKAGE_EXTENSION} dependencies found for ${OPENWRT_VERSION}/${arch}"
              exit 1
            fi

            while IFS= read -r link; do
              filename="$(basename "${link%/download}")"
              echo "Downloading ${arch}/${filename}..."
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --retry 4 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 1200 \
                -o "${output_dir}/depends/${filename}" \
                "${link}"
              test -s "${output_dir}/depends/${filename}"
            done < "${links_file}"

            package_count="$(find "${output_dir}/depends" -maxdepth 1 -type f -name "*.${PACKAGE_EXTENSION}" | wc -l)"
            echo "Downloaded ${package_count} offline dependency packages for ${arch}."

            if [ "${package_count}" -lt 10 ]; then
              echo "::error::Dependency bundle for ${arch} is unexpectedly incomplete"
              exit 1
            fi
          }

          download_dependencies "x86_64" "passwall_x86_64"
          download_dependencies "aarch64_cortex-a53" "passwall_aarch64_cortex-a53"
          download_dependencies "aarch64_generic" "passwall_aarch64_generic"

      - name: Clone makeself repository
        run: git clone --depth 1 https://github.com/megastep/makeself.git

      - name: Prepare architecture packages
        run: |
          set -euo pipefail

          for package_dir in \
            passwall_x86_64 \
            passwall_aarch64_cortex-a53 \
            passwall_aarch64_generic; do
            mkdir -p "${package_dir}/main"
            cp downloads/*."${PACKAGE_EXTENSION}" "${package_dir}/main/"
            echo "${OPENWRT_VERSION}" > "${package_dir}/openwrt-version"
            echo "${PASSWALL_TAG}" > "${package_dir}/passwall-version"
          done

      - name: Create install scripts
        run: |
          set -euo pipefail

          create_install_script() {
            local package_dir="$1"
            local expected_arch="$2"

            cat > "${package_dir}/install.sh" <<'INSTALL_SCRIPT'
          #!/bin/sh
          set -eu

          expected_arch="__EXPECTED_ARCH__"
          expected_release="__EXPECTED_RELEASE__"

          error() {
            echo "Error: $*" >&2
            exit 1
          }

          [ -f /etc/openwrt_release ] || error "this installer must run on OpenWrt"
          . /etc/openwrt_release

          case "${DISTRIB_RELEASE:-}" in
            "$expected_release"|"$expected_release".*) ;;
            *) error "OpenWrt $expected_release is required; detected ${DISTRIB_RELEASE:-unknown}" ;;
          esac

          [ "${DISTRIB_ARCH:-unknown}" = "$expected_arch" ] || \
            error "architecture mismatch: package=$expected_arch, device=${DISTRIB_ARCH:-unknown}"

          cd "$(dirname "$0")"

          available_mb="$(df -Pm /usr | awk 'END { print $4 }')"
          [ "${available_mb:-0}" -ge 350 ] || \
            error "at least 350 MB of free space on /usr is required for the complete offline bundle"

          if [ "$expected_release" = "24.10" ]; then
            command -v opkg >/dev/null 2>&1 || error "opkg was not found"
            find main -type f -name '*.ipk' -print -quit | grep -q . || error "IPK packages are missing"
            find depends -type f -name '*.ipk' -print -quit | grep -q . || error "offline IPK dependencies are missing"

            # Every PassWall user-space package is local; no PassWall feed is contacted here.
            opkg install --force-downgrade depends/*.ipk
            opkg install --force-downgrade main/*.ipk
          else
            command -v apk >/dev/null 2>&1 || error "apk was not found"
            find main -type f -name '*.apk' -print -quit | grep -q . || error "APK packages are missing"
            find depends -type f -name '*.apk' -print -quit | grep -q . || error "offline APK dependencies are missing"

            # Every PassWall user-space package is local; no PassWall feed is contacted here.
            apk add --allow-untrusted depends/*.apk main/*.apk
          fi

          rm -rf /tmp/luci-*

          if [ -x /etc/init.d/passwall ]; then
            /etc/init.d/passwall restart || true
          fi

          echo "PassWall installation completed."
          INSTALL_SCRIPT

            sed -i \
              -e "s/__EXPECTED_ARCH__/${expected_arch}/" \
              -e "s/__EXPECTED_RELEASE__/${OPENWRT_VERSION}/" \
              "${package_dir}/install.sh"
            chmod +x "${package_dir}/install.sh"
          }

          create_install_script "passwall_x86_64" "x86_64"
          create_install_script "passwall_aarch64_cortex-a53" "aarch64_cortex-a53"
          create_install_script "passwall_aarch64_generic" "aarch64_generic"

      - name: Create self-extracting packages
        run: |
          set -euo pipefail

          mv passwall_x86_64 makeself/
          mv passwall_aarch64_cortex-a53 makeself/
          mv passwall_aarch64_generic makeself/

          cd makeself
          ./makeself.sh \
            passwall_x86_64/ \
            "passwall_${PASSWALL_SAFE_TAG}_openwrt-${OPENWRT_VERSION}_x86_64.run" \
            "PassWall ${PASSWALL_TAG} for OpenWrt ${OPENWRT_VERSION} x86_64" \
            ./install.sh

          ./makeself.sh \
            passwall_aarch64_cortex-a53/ \
            "passwall_${PASSWALL_SAFE_TAG}_openwrt-${OPENWRT_VERSION}_aarch64_cortex-a53.run" \
            "PassWall ${PASSWALL_TAG} for OpenWrt ${OPENWRT_VERSION} aarch64_cortex-a53" \
            ./install.sh

          ./makeself.sh \
            passwall_aarch64_generic/ \
            "passwall_${PASSWALL_SAFE_TAG}_openwrt-${OPENWRT_VERSION}_aarch64_generic.run" \
            "PassWall ${PASSWALL_TAG} for OpenWrt ${OPENWRT_VERSION} aarch64_generic" \
            ./install.sh

      - name: Verify run files
        run: |
          set -euo pipefail
          ls -lh makeself/passwall_*.run
          test "$(find makeself -maxdepth 1 -type f -name 'passwall_*.run' | wc -l)" -eq 3

      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          PassWall ${PASSWALL_TAG} installers for OpenWrt ${OPENWRT_VERSION}.

          Architectures:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_generic

          The run files include the complete matching passwall_packages dependency feed and do not download PassWall components during installation.

          Note: firmware-specific kernel modules cannot be made universal across every OpenWrt build. The target firmware must already provide any required kernel modules and base-system libraries.
          EOF

          if [ -f common.md ]; then
            printf '\n' >> release-notes.md
            cat common.md >> release-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: passwall-${{ env.PASSWALL_SAFE_TAG }}-openwrt-${{ env.OPENWRT_VERSION }}
          name: PassWall ${{ env.PASSWALL_TAG }} for OpenWrt ${{ env.OPENWRT_VERSION }}
          body_path: release-notes.md
          files: makeself/passwall_*.run
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
