name: Make PassWall run files

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt version
        required: true
        default: "24.10"
        type: choice
        options:
          - "25.12"
          - "24.10"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone makeself repository
        run: git clone --depth 1 https://github.com/megastep/makeself.git

      - name: Download packages from kenzok8/small
        shell: bash
        run: |
          set -euo pipefail

          case "$OPENWRT_VERSION" in
            25.12) package_extension=apk ;;
            24.10) package_extension=ipk ;;
            *) echo "Unsupported OpenWrt version: $OPENWRT_VERSION" >&2; exit 1 ;;
          esac

          mkdir -p passwall_x86_64/packages passwall_aarch64/packages

          find_release() {
            architecture="$1"
            page=1
            while [ "$page" -le 10 ]; do
              releases="$(curl --fail --silent --show-error --location --retry 3 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/kenzok8/small/releases?per_page=100&page=$page")"
              release="$(jq -c --arg arch "$architecture" --arg version "$OPENWRT_VERSION" '
                [.[]
                 | select(.draft == false)
                 | select(.tag_name | test("^[0-9]+-" + $arch + "-" + $version + "([.-]|$)"))][0] // empty
              ' <<< "$releases")"
              if [ -n "$release" ]; then
                printf '%s\n' "$release"
                return 0
              fi
              [ "$(jq 'length' <<< "$releases")" -lt 100 ] && break
              page=$((page + 1))
            done
            echo "No kenzok8/small release found for $architecture / OpenWrt $OPENWRT_VERSION" >&2
            return 1
          }

          download_release_packages() {
            architecture="$1"
            destination="$2"
            release_json="$(find_release "$architecture")"
            release_tag="$(jq -r '.tag_name' <<< "$release_json")"
            echo "Using kenzok8/small release: $release_tag" >&2

            jq -r --arg extension "$package_extension" '
              .assets[]
              | select(.name | endswith("." + $extension))
              | select(
                  ((.name | startswith("luci-app-")) | not)
                  or (.name | test("^luci-app-passwall([_-])"))
                )
              | select(
                  ((.name | startswith("luci-i18n-")) | not)
                  or (.name | test("^luci-i18n-passwall-zh-cn([_-])"))
                )
              # sing-box and sing-box-tiny are mutually exclusive. PassWall
              # can use the tiny variant, so exclude only the full package.
              | select(.name | test("^sing-box[_-][0-9]") | not)
              | [.name, .browser_download_url] | @tsv
            ' <<< "$release_json" |
            while IFS="$(printf '\t')" read -r asset_name asset_url; do
              curl --fail --show-error --location --retry 3 \
                -o "$destination/$asset_name" "$asset_url"
            done

            package_count="$(find "$destination" -type f -name "*.$package_extension" | wc -l)"
            if [ "$package_count" -eq 0 ]; then
              echo "No .$package_extension packages downloaded from $release_tag" >&2
              return 1
            fi
            printf '%s' "$release_tag"
          }

          x86_tag="$(download_release_packages x86_64 passwall_x86_64/packages)"
          aarch64_tag="$(download_release_packages aarch64_cortex-a53 passwall_aarch64/packages)"
          printf 'PACKAGE_EXTENSION=%s\n' "$package_extension" >> "$GITHUB_ENV"
          printf 'X86_SOURCE_TAG=%s\n' "$x86_tag" >> "$GITHUB_ENV"
          printf 'AARCH64_SOURCE_TAG=%s\n' "$aarch64_tag" >> "$GITHUB_ENV"

      - name: Create install scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PACKAGE_EXTENSION" = apk ]; then
            cat <<'EOF' > passwall_x86_64/install.sh
          #!/bin/sh
          set -e
          apk update
          apk add --allow-untrusted packages/*.apk
          EOF
          else
            cat <<'EOF' > passwall_x86_64/install.sh
          #!/bin/sh
          set -eu

          opkg update

          # Defensive cleanup: retain sing-box-tiny and discard the mutually
          # exclusive full sing-box package if upstream naming changes.
          rm -f packages/sing-box_[0-9]*.ipk packages/sing-box-[0-9]*.ipk

          # Use list-installed instead of `opkg status`, whose behavior differs
          # between opkg versions. Remove a pre-existing full sing-box package
          # before installing the selected tiny variant.
          if opkg list-installed | grep -q '^sing-box '; then
            echo "Removing installed sing-box before installing sing-box-tiny"
            opkg remove --force-depends sing-box
          fi

          # Recent mihomo packages manage /usr/bin/mihomo with opkg
          # alternatives. Preserve an existing regular file before the
          # package creates its symlink.
          if [ -e /usr/bin/mihomo ] && [ ! -L /usr/bin/mihomo ]; then
            backup=/usr/bin/mihomo.pre-passwall
            index=0
            while [ -e "$backup" ]; do
              index=$((index + 1))
              backup="/usr/bin/mihomo.pre-passwall.$index"
            done
            mv /usr/bin/mihomo "$backup"
            echo "Existing mihomo executable backed up to $backup"
          fi

          opkg install packages/*.ipk
          EOF
          fi
          chmod +x passwall_x86_64/install.sh
          cp passwall_x86_64/install.sh passwall_aarch64/install.sh

      - name: Create self-extracting packages
        shell: bash
        run: |
          set -euo pipefail
          mv passwall_x86_64 passwall_aarch64 makeself/
          cd makeself
          ./makeself.sh passwall_x86_64/ \
            "passwall_x86_64_openwrt-${OPENWRT_VERSION}.run" \
            "PassWall for OpenWrt ${OPENWRT_VERSION}" ./install.sh
          ./makeself.sh passwall_aarch64/ \
            "passwall_aarch64_cortex-a53_openwrt-${OPENWRT_VERSION}.run" \
            "PassWall for OpenWrt ${OPENWRT_VERSION}" ./install.sh
          ls -lh passwall_*.run

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'OpenWrt: `%s`\n\n' "$OPENWRT_VERSION"
            printf 'Package format: `%s`\n\n' "$PACKAGE_EXTENSION"
            printf 'x86_64 source: `kenzok8/small %s`\n\n' "$X86_SOURCE_TAG"
            printf 'aarch64_cortex-a53 source: `kenzok8/small %s`\n' "$AARCH64_SOURCE_TAG"
          } > release_notes.md

      - name: Create release and upload run files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: passwall-openwrt-${{ env.OPENWRT_VERSION }}
          name: PassWall for OpenWrt ${{ env.OPENWRT_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body_path: release_notes.md
          files: makeself/passwall_*.run
          fail_on_unmatched_files: true
