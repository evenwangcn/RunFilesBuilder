name: Make Passwall run files

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt version
        required: true
        type: choice
        default: "24.10"
        options:
          - "25.12"
          - "24.10"
          - "23.05"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read latest PassWall release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest \
            --output passwall-release.json

          latest_tag="$(jq -er '.tag_name' passwall-release.json)"
          echo "LATEST_TAG=$latest_tag" >> "$GITHUB_ENV"

      - name: Clone makeself repository
        run: git clone --depth 1 https://github.com/megastep/makeself.git

      - name: Download PassWall files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads

          if [[ "$OPENWRT_VERSION" == "25.12" ]]; then
            package_prefix='25\.12\+'
            package_extension='apk'
          else
            package_prefix='23\.05-24\.10'
            package_extension='ipk'
            curl --fail --show-error --location \
              --output downloads/passwall_packages_ipk_x86_64.zip \
              https://github.com/wkccd/storage/releases/download/pw/passwall_packages_ipk_x86_64.zip
            curl --fail --show-error --location \
              --output downloads/passwall_packages_ipk_aarch64_cortex-a53.zip \
              https://github.com/wkccd/storage/releases/download/pw/passwall_packages_ipk_aarch64_cortex-a53.zip
          fi

          app_url="$(jq -er --arg prefix "$package_prefix" '
            [.assets[]
             | select(.name | test("^" + $prefix + "_luci-app-passwall[-_].*\\.(ipk|apk)$"))
             | .browser_download_url][0]
          ' passwall-release.json)"
          i18n_url="$(jq -er --arg prefix "$package_prefix" '
            [.assets[]
             | select(.name | test("^" + $prefix + "_luci-i18n-passwall-zh-cn[-_].*\\.(ipk|apk)$"))
             | .browser_download_url][0]
          ' passwall-release.json)"

          curl --fail --show-error --location --remote-name \
            --output-dir downloads "$app_url"
          curl --fail --show-error --location --remote-name \
            --output-dir downloads "$i18n_url"

          test "$(find downloads -maxdepth 1 -name "*.${package_extension}" | wc -l)" -eq 2

      - name: Organize package files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p passwall_x86_64/depends passwall_x86_64/main
          mkdir -p passwall_aarch64/depends passwall_aarch64/main

          if [[ "$OPENWRT_VERSION" == "25.12" ]]; then
            cp downloads/*.apk passwall_x86_64/main/
            cp downloads/*.apk passwall_aarch64/main/
          else
            unzip -q downloads/passwall_packages_ipk_x86_64.zip \
              -d passwall_x86_64/depends
            unzip -q downloads/passwall_packages_ipk_aarch64_cortex-a53.zip \
              -d passwall_aarch64/depends
            cp downloads/*.ipk passwall_x86_64/main/
            cp downloads/*.ipk passwall_aarch64/main/
          fi

      - name: Create install scripts
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' > passwall_x86_64/install.sh
          #!/bin/sh
          set -e

          cd "$(dirname "$0")"
          if command -v apk >/dev/null 2>&1; then
              apk update
              apk add --allow-untrusted main/*.apk
          else
              opkg update
              opkg install \
                iptables-mod-tproxy \
                iptables-mod-socket \
                iptables-mod-iprange \
                iptables-mod-conntrack-extra
              opkg install depends/*.ipk
              opkg install main/*.ipk
          fi
          EOF
          chmod +x passwall_x86_64/install.sh
          cp passwall_x86_64/install.sh passwall_aarch64/install.sh

      - name: Create self-extracting packages
        shell: bash
        run: |
          set -euo pipefail
          mv passwall_x86_64 passwall_aarch64 makeself/
          cd makeself
          ./makeself.sh passwall_x86_64/ \
            "passwall_x86_64_openwrt-${OPENWRT_VERSION}_${LATEST_TAG}.run" \
            "PassWall for OpenWrt ${OPENWRT_VERSION}" ./install.sh
          ./makeself.sh passwall_aarch64/ \
            "passwall_aarch64_a53_openwrt-${OPENWRT_VERSION}_${LATEST_TAG}.run" \
            "PassWall for OpenWrt ${OPENWRT_VERSION}" ./install.sh
          ls -lh passwall_*.run

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release_notes.md <<EOF
          PassWall ${LATEST_TAG}

          OpenWrt version selected for this build: ${OPENWRT_VERSION}
          EOF

      - name: Create or update release and upload run files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: PassWall-${{ env.LATEST_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body_path: release_notes.md
          files: makeself/passwall_*.run
          fail_on_unmatched_files: true
          overwrite_files: true
